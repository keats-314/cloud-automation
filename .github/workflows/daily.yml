name: 双选会监控每日刷新

# 云端定时：完全脱离你本地电脑运行，不开电脑/不登软件也会每天自动跑。
# GitHub Actions 的 cron 使用 UTC 时区，北京时间 = UTC + 8。
# GitHub Actions cron 是 5 字段格式：分 时 日 月 周
#   北京 08:00 = UTC 00:00 → "0 0 * * *"
# 每天北京 08:00 自动触发：检索 → 重建 → 部署到 GitHub Pages（永久链接）→ 发邮件到邮箱。
on:
  schedule:
    - cron: "0 0 * * *"     # UTC 00:00 = 北京时间 每天 08:00
  workflow_dispatch: {}      # 允许手动触发（测试用）

permissions:
  contents: write            # 允许把刷新后的数据写回仓库 + 推送 gh-pages 部署分支

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 检索 + 重建（Tier1 官网直抓 + 搜索引擎核实 → 合并 → 生成 dist）
        env:
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: npm run refresh

      - name: 提交刷新后的数据（保留历史基线）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 每日自动刷新双选会数据 $(date +'%Y-%m-%d')"
          git push

      # —— 永久链接：部署到 GitHub Pages（无 token、不过期、国内可访问）——
      - name: 部署到 GitHub Pages（永久链接）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: 更新看板 $(date +'%Y-%m-%d')"

      # —— 自动发邮件（仅当你在仓库 Secrets 里填了 SMTP 密钥才会运行）——
      - name: 生成邮件正文
        id: gen
        if: ${{ env.SMTP_PASSWORD != '' }}
        run: |
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("dist/records.json","utf8"));
            const url="https://keats-314.github.io/cloud-automation/";
            const today=new Date().toISOString().slice(0,10);
            let body=`双选会监控 · 每日自动播报（${today}）\n\n`;
            body+=`📊 当前总记录数：${d.total} 条\n`;
            body+=`🆕 本轮新增：${d.new} 条\n`;
            body+=`🕒 数据更新时间：${d.updated}\n\n`;
            body+=`👉 完整看板（永久链接，点开即看）：\n${url}\n\n`;
            body+=`—— 本邮件由 GitHub Actions 每日 08:00 自动抓取后发送，无需你开电脑。`;
            fs.writeFileSync("email_body.txt", body);
          '
          {
            echo "body<<EOF"
            cat email_body.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 发送邮件到邮箱
        if: ${{ env.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "【双选会监控】每日播报 ${{ github.run_id }}"
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          body: ${{ steps.gen.outputs.body }}
