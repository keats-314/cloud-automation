name: 双选会监控每日刷新

# 云端定时：完全脱离你本地电脑运行，不开电脑/不登软件也会每天自动跑。
# GitHub Actions 的 cron 使用 UTC 时区，北京时间 = UTC + 8。
# GitHub Actions cron 是 5 字段格式：分 时 日 月 周
#   北京 08:00 = UTC 00:00 → "0 0 * * *"
# 每天北京 08:00 自动触发：检索 → 重建 → 部署到 GitHub Pages（永久链接）→ 发邮件到邮箱。
on:
  schedule:
    - cron: "0 0 * * *"     # UTC 00:00 = 北京时间 每天 08:00
  workflow_dispatch: {}      # 允许手动触发（测试用）

permissions:
  contents: write            # 允许把刷新后的数据写回仓库 + 推送 gh-pages 部署分支

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      KIT_FORM_ID: ${{ secrets.KIT_FORM_ID }}
      SUBSCRIBE_ENDPOINT: ${{ secrets.SUBSCRIBE_ENDPOINT }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      DASHBOARD_URL: "https://keats-314.github.io/cloud-automation/"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 检索 + 重建（Tier1 官网直抓 + 搜索引擎核实 → 合并 → 生成 dist）
        env:
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: npm run refresh

      - name: 提交刷新后的数据（保留历史基线）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 每日自动刷新双选会数据 $(date +'%Y-%m-%d')"
          git push

      # —— 永久链接：部署到 GitHub Pages（无 token、不过期、国内可访问）——
      - name: 部署到 GitHub Pages（永久链接）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: 更新看板 $(date +'%Y-%m-%d')"

      # —— 自动发邮件（多订阅者广播；仅当你在仓库 Secrets 里填了 SMTP 密钥才会运行）——
      # 收件人来源：优先读 Kit（ConvertKit）订阅列表（KIT_API_KEY），
      # 未配置时回退到单一收件人 TO_EMAIL。两者都未配置则跳过。
      - name: 广播邮件给所有订阅者
        if: ${{ env.SMTP_PASSWORD != '' }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: node broadcast.mjs
